<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ouvidoria CETEP LNAB</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Estilos específicos para a Dashboard */
        .manifestacao-card {
            border-left: 5px solid var(--cetep-azul); /* Detalhe azul na lateral */
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .manifestacao-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        .status-pendente { 
            color: var(--cetep-vermelho); 
            font-weight: 700; 
        }
        .status-respondida { 
            color: #28a745; /* Verde para respondido */
            font-weight: 700; 
        }
        .header {
            border-bottom: 2px solid #eee;
        }
        .dark-theme .manifestacao-card {
            border-left: 5px solid #fff;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        
        <div class="header d-flex justify-content-between align-items-center mb-4 pb-3">
            <h1 class="h3"><i class="fas fa-chart-line me-2"></i> Dashboard Administrativa</h1>
            <div>
                <button id="toggleTheme" class="btn btn-outline-secondary btn-sm me-2"><i class="fas fa-moon me-1"></i> Tema Escuro</button>
                <a href="{{ url_for('index') }}" class="btn btn-danger"><i class="fas fa-sign-out-alt me-1"></i> Sair</a>
            </div>
        </div>

        <div class="mb-4">
            <label for="filtroStatus" class="form-label fw-bold">Filtrar por Status:</label>
            <select id="filtroStatus" class="form-select w-auto">
                <option value="todos">Todos</option>
                <option value="pendente">Pendentes</option>
                <option value="respondida">Respondidas</option>
            </select>
        </div>

        <div id="manifestacoes-container" class="row">
            </div>

        <div id="loading" class="text-center mt-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2">Carregando manifestações...</p>
        </div>
        
    </div>

    <div class="modal fade" id="respostaModal" tabindex="-1" aria-labelledby="respostaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="respostaModalLabel">Responder Manifestação <span id="modalProtocolo" class="badge bg-light text-primary ms-2"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="modalDetalhes" class="mb-3 p-3 border rounded bg-light">
                        </div>
                    <form id="formResposta">
                        <input type="hidden" id="protocoloResposta" name="protocolo">
                        <div class="mb-3">
                            <label for="responseTextarea" class="form-label fw-bold">Sua Resposta Oficial:</label>
                            <textarea class="form-control" id="responseTextarea" name="resposta" rows="8" required minlength="10"></textarea>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg" id="sendResponseButton">
                                <i class="fas fa-paper-plane me-1"></i> Enviar Resposta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Variáveis globais
        let currentProtocolo = null;
        const manifestacoesContainer = document.getElementById('manifestacoes-container');
        const loadingSpinner = document.getElementById('loading');
        const filtroStatus = document.getElementById('filtroStatus');
        
        // Modal elements
        const respostaModalElement = document.getElementById('respostaModal');
        const respostaModal = new bootstrap.Modal(respostaModalElement);
        const modalProtocolo = document.getElementById('modalProtocolo');
        const modalDetalhes = document.getElementById('modalDetalhes');
        const responseTextarea = document.getElementById('responseTextarea');
        const protocoloResposta = document.getElementById('protocoloResposta');
        const sendResponseButton = document.getElementById('sendResponseButton');

        // ===============================================
        // LÓGICA DE TEMA ESCURO (DARK MODE) - CORREÇÃO
        // ===============================================
        const toggleThemeButton = document.getElementById('toggleTheme');
        const body = document.body;
        const themeKey = 'ouvidoria-dark-theme';

        function aplicarTemaSalvo() {
            const savedTheme = localStorage.getItem(themeKey);
            if (savedTheme === 'enabled') {
                body.classList.add('dark-theme');
                if (toggleThemeButton) {
                    toggleThemeButton.innerHTML = '<i class="fas fa-sun me-1"></i> Tema Claro';
                }
            } else {
                body.classList.remove('dark-theme');
                if (toggleThemeButton) {
                    toggleThemeButton.innerHTML = '<i class="fas fa-moon me-1"></i> Tema Escuro';
                }
            }
        }

        function toggleTheme() {
            if (body.classList.contains('dark-theme')) {
                body.classList.remove('dark-theme');
                localStorage.setItem(themeKey, 'disabled');
                toggleThemeButton.innerHTML = '<i class="fas fa-moon me-1"></i> Tema Escuro';
            } else {
                body.classList.add('dark-theme');
                localStorage.setItem(themeKey, 'enabled');
                toggleThemeButton.innerHTML = '<i class="fas fa-sun me-1"></i> Tema Claro';
            }
        }
        
        document.addEventListener('DOMContentLoaded', aplicarTemaSalvo);
        if (toggleThemeButton) {
            toggleThemeButton.addEventListener('click', toggleTheme);
        }
        // ===============================================

        // -----------------------------------------------
        // FUNÇÕES DA DASHBOARD
        // -----------------------------------------------
        
        function formatarDetalhes(m) {
            return `
                <p><strong>Nome:</strong> ${m.nome || 'Anônimo'}</p>
                <p><strong>Tipo:</strong> ${m.tipo.toUpperCase()}</p>
                <p><strong>Data:</strong> ${m.data}</p>
                <hr>
                <p><strong>Descrição:</strong></p>
                <p class="mb-0">${m.descricao}</p>
            `;
        }
        
        function abrirModal(manifestacao) {
            currentProtocolo = manifestacao.protocolo;
            
            modalProtocolo.textContent = '#' + currentProtocolo;
            modalDetalhes.innerHTML = formatarDetalhes(manifestacao);
            
            // Preenche o campo de resposta se já houver uma
            responseTextarea.value = manifestacao.resposta || '';
            protocoloResposta.value = currentProtocolo;

            // Desabilita o campo de resposta e o botão se já estiver respondida
            if (manifestacao.resposta) {
                responseTextarea.disabled = true;
                sendResponseButton.disabled = true;
                sendResponseButton.textContent = 'Já Respondida';
                sendResponseButton.classList.remove('btn-success');
                sendResponseButton.classList.add('btn-secondary');
            } else {
                responseTextarea.disabled = false;
                sendResponseButton.disabled = false;
                sendResponseButton.textContent = 'Enviar Resposta';
                sendResponseButton.classList.remove('btn-secondary');
                sendResponseButton.classList.add('btn-success');
            }
            
            respostaModal.show();
        }

        function fecharModal() {
            respostaModal.hide();
            // Limpa o formulário e variáveis
            document.getElementById('formResposta').reset();
            currentProtocolo = null;
        }

        function renderizarManifestacoes(manifestacoes, filtro) {
            manifestacoesContainer.innerHTML = '';
            
            manifestacoes.forEach(m => {
                const status = m.resposta ? 'respondida' : 'pendente';
                
                if (filtro !== 'todos' && status !== filtro) {
                    return; // Pula se não corresponder ao filtro
                }

                const statusClass = status === 'pendente' ? 'status-pendente' : 'status-respondida';
                const statusText = status === 'pendente' ? 'Pendente' : 'Respondida';
                const buttonText = status === 'pendente' ? 'Responder' : 'Ver Resposta';
                const buttonClass = status === 'pendente' ? 'btn-outline-primary' : 'btn-outline-secondary';
                
                const cardHtml = `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card manifestacao-card shadow-sm h-100 p-3">
                            <div class="card-body">
                                <span class="badge bg-secondary mb-2">${m.tipo.toUpperCase()}</span>
                                <h5 class="card-title fw-bold">Protocolo: #${m.protocolo}</h5>
                                <p class="card-text mb-1">
                                    <i class="fas fa-user me-1"></i> 
                                    ${m.nome || '<span class="text-muted">Anônimo</span>'}
                                </p>
                                <p class="card-text mb-2">
                                    <i class="fas fa-clock me-1"></i> 
                                    ${m.data}
                                </p>
                                <p class="card-text fw-bold">
                                    Status: <span class="${statusClass}">${statusText}</span>
                                </p>
                                <div class="mt-3">
                                    <button class="btn ${buttonClass} btn-sm w-100" onclick='abrirModal(${JSON.stringify(m)})'>
                                        <i class="fas fa-reply me-1"></i> ${buttonText}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                manifestacoesContainer.innerHTML += cardHtml;
            });

            if (manifestacoesContainer.innerHTML === '') {
                 manifestacoesContainer.innerHTML = '<div class="col-12"><div class="alert alert-info text-center">Nenhuma manifestação encontrada com este filtro.</div></div>';
            }
        }

        function carregarManifestacoes(reload = false) {
            loadingSpinner.style.display = 'block';
            manifestacoesContainer.innerHTML = '';
            
            // Verifica o filtro atual
            const filtro = filtroStatus.value;

            fetch('/api/manifestacoes')
                .then(response => response.json())
                .then(data => {
                    // Inverte a ordem para mostrar os mais novos primeiro
                    data.reverse(); 
                    renderizarManifestacoes(data, filtro);
                })
                .catch(error => {
                    console.error('Erro ao carregar manifestações:', error);
                    manifestacoesContainer.innerHTML = '<div class="alert alert-danger col-12">Não foi possível carregar as manifestações. Tente novamente mais tarde.</div>';
                })
                .finally(() => {
                    loadingSpinner.style.display = 'none';
                });
        }
        
        // Listener para o filtro
        filtroStatus.addEventListener('change', () => carregarManifestacoes(true));

        // Listener para o formulário de resposta
        document.getElementById('formResposta').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const resposta = responseTextarea.value.trim();
            if (resposta.length < 10) {
                alert('A resposta deve ter pelo menos 10 caracteres.');
                return;
            }

            sendResponseButton.disabled = true;
            sendResponseButton.textContent = 'Enviando...';

            const payload = new URLSearchParams(new FormData(e.target));

            fetch('/responder', {
                method: 'POST',
                body: payload
            })
            .then(response => response.json())
            .then(data => {
                if (data.mensagem) {
                    alert(data.mensagem); 
                    fecharModal();
                    carregarManifestacoes(true); // Recarrega a lista para ver a mudança
                } else {
                    alert('Erro ao enviar resposta: ' + (data.erro || 'Erro desconhecido.'));
                }
            })
            .catch(error => {
                console.error('Erro na requisição de resposta:', error);
                alert('Erro de conexão com o servidor ao enviar a resposta.');
            })
            .finally(() => {
                sendResponseButton.disabled = false;
                sendResponseButton.textContent = 'Enviar Resposta';
            });
        });

        // Iniciar o carregamento das manifestações
        document.addEventListener('DOMContentLoaded', carregarManifestacoes);
    </script>
</body>
</html>

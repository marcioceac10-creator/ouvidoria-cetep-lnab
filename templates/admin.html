<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo - CETEP Ouvidoria</title>
    <!-- Adiciona Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilo customizado para a fonte Inter e fundo */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Um cinza claro suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Garantindo que o input de senha funcione bem com auto-complete */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            box-shadow: 0 0 0 30px white inset !important;
        }
    </style>
</head>
<body>
    <div class="w-full max-w-md p-8 bg-white rounded-xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Acesso Administrativo</h1>
        <p class="text-center text-sm text-gray-500 mb-8">CETEP - Ouvidoria LNAB</p>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="usuarioAdmin" class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
                <!-- O atributo name="usuarioAdmin" é essencial para o Flask -->
                <input type="text" placeholder="Entre com o Usuário" id="usuarioAdmin" name="usuarioAdmin" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>

            <div>
                <label for="senhaAdmin" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                 <!-- O atributo name="senhaAdmin" é essencial para o Flask -->
                <input type="password" placeholder="Entre com a Senha" id="senhaAdmin" name="senhaAdmin" required
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out">
            </div>
            
            <!-- Mensagem de erro/sucesso -->
            <div id="messageBox" class="text-center p-3 rounded-lg hidden" role="alert"></div>

            <button type="submit" id="loginButton"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-lg font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                Entrar
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const form = e.target;
            const messageBox = document.getElementById('messageBox');
            const loginButton = document.getElementById('loginButton');

            // 1. Limpa e desabilita o botão
            loginButton.disabled = true;
            loginButton.textContent = 'Aguarde...';
            // Remove todas as classes de status
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800'); 
            messageBox.textContent = '';
            
            // 2. Faz a requisição POST para o Flask
            fetch('/admin_login', {
                method: 'POST',
                // Usa URLSearchParams com FormData para enviar os dados no formato esperado pelo Flask
                body: new URLSearchParams(new FormData(form))
            })
            .then(response => {
                // Processa a resposta JSON e o status ao mesmo tempo
                return response.json().then(data => ({ status: response.status, body: data }));
            })
            .then(({ status, body }) => {
                if (status === 200) {
                    // SUCESSO: O Flask retornou 200
                    messageBox.classList.remove('hidden');
                    messageBox.classList.add('bg-green-100', 'text-green-800');
                    messageBox.textContent = 'Login realizado com sucesso! Redirecionando...';
                    
                    // Redireciona para o painel de administrador (o URL está em body.redirect)
                    setTimeout(() => {
                        window.location.href = body.redirect; 
                    }, 500); // Dá meio segundo para a mensagem de sucesso aparecer
                } else if (status === 401) {
                    // FALHA: O Flask retornou 401 (Não Autorizado)
                    messageBox.classList.remove('hidden');
                    messageBox.classList.add('bg-red-100', 'text-red-800');
                    // Exibe a mensagem de erro fornecida pelo Flask, ou uma padrão
                    messageBox.textContent = body.erro || 'Credenciais inválidas. Tente novamente.';
                } else {
                     // OUTROS ERROS DO SERVIDOR (ex: 500)
                    messageBox.classList.remove('hidden');
                    messageBox.classList.add('bg-red-100', 'text-red-800');
                    messageBox.textContent = body.erro || 'Erro inesperado no servidor. Código: ' + status;
                }
            })
            .catch(error => {
                // Erro de rede (ex: servidor Flask não está rodando)
                console.error('Erro na requisição:', error);
                messageBox.classList.remove('hidden');
                messageBox.classList.add('bg-red-100', 'text-red-800');
                messageBox.textContent = 'Erro de conexão. Verifique a URL do servidor.';
            })
            .finally(() => {
                // Reabilita o botão após a tentativa
                loginButton.disabled = false;
                loginButton.textContent = 'Entrar';
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CETEP Ouvidoria</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card shadow-lg border-0">
                    <div class="card-header text-center bg-primary text-white" style="border-radius: 12px 12px 0 0;">
                        <h4 class="mb-0 py-2">Área Administrativa</h4>
                    </div>
                    
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                             <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                            <p class="text-muted">Acesso restrito à equipe da Ouvidoria.</p>
                        </div>
                        
                        <form id="formAdminLogin">
                            <div class="mb-3">
                                <label for="usuarioAdmin" class="form-label">Usuário</label>
                                <input type="text" class="form-control" id="usuarioAdmin" name="usuarioAdmin" required>
                            </div>
                            <div class="mb-4">
                                <label for="senhaAdmin" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senhaAdmin" name="senhaAdmin" required>
                            </div>
                            
                            <div id="messageBox" class="alert alert-danger hidden" role="alert"></div>
                            
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg" id="loginButton">
                                    <i class="fas fa-sign-in-alt me-2"></i> Entrar
                                </button>
                            </div>
                        </form>
                    </div>
                    
                    <div class="card-footer text-center bg-light">
                        <a href="{{ url_for('index') }}" class="text-decoration-none text-primary">← Voltar para a Página Inicial</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('formAdminLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const form = e.target;
            const messageBox = document.getElementById('messageBox');
            const loginButton = document.getElementById('loginButton');

            loginButton.disabled = true;
            loginButton.textContent = 'Aguarde...';

            // Limpa e esconde a mensagem
            messageBox.classList.remove('alert-success', 'alert-danger');
            messageBox.classList.add('hidden');
            messageBox.textContent = '';
            
            fetch('/admin_login', {
                method: 'POST',
                body: new URLSearchParams(new FormData(form))
            })
            .then(response => response.json().then(data => ({ status: response.status, body: data })))
            .then(({ status, body }) => {
                
                messageBox.classList.remove('hidden'); // Mostra a caixa

                if (status === 200) {
                    messageBox.classList.add('alert-success');
                    messageBox.textContent = 'Login realizado com sucesso! Redirecionando...';
                    window.location.href = body.redirect; 
                } else {
                    messageBox.classList.add('alert-danger');
                    messageBox.textContent = body.erro || 'Credenciais inválidas.';
                }
            })
            .catch(error => {
                console.error('Erro na requisição:', error);
                messageBox.classList.add('alert-danger');
                messageBox.textContent = 'Erro de conexão com o servidor.';
            })
            .finally(() => {
                loginButton.disabled = false;
                loginButton.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i> Entrar'; // Retorna o ícone e texto original
            });
        });
        
    </script>
</body>
</html>

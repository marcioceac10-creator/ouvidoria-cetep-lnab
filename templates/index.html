<script>
    // ===============================================
    // FUNÇÃO AUXILIAR PARA RENDERIZAR RESULTADOS
    // (MANTIDA DO SEU CÓDIGO ORIGINAL)
    // ===============================================
    function formatResults(data, containerId) {
        const container = $('#' + containerId);
        container.empty();

        if (Array.isArray(data)) {
            // Se for consulta por CPF/Matrícula (múltiplos resultados)
            if (data.length === 0) {
                container.html('<div class="alert alert-info">Nenhuma manifestação encontrada.</div>');
                return;
            }
            data.forEach(m => {
                const status = m.resposta ? '<span class="text-success fw-bold">RESPONDIDA</span>' : '<span class="text-danger fw-bold">PENDENTE</span>';
                const respostaDetalhe = m.resposta ? `<p class="mt-2 p-2 border rounded bg-light"><strong>Resposta:</strong> ${m.resposta}</p>` : '';
                
                const html = `
                    <div class="card mb-3 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title text-primary">Protocolo: #${m.protocolo}</h5>
                            <p class="card-text mb-1"><strong>Tipo:</strong> ${m.tipo.toUpperCase()}</p>
                            <p class="card-text mb-1"><strong>Data:</strong> ${m.data}</p>
                            <p class="card-text mb-1"><strong>Status:</strong> ${status}</p>
                            ${respostaDetalhe}
                        </div>
                    </div>
                `;
                container.append(html);
            });
        } else {
            // Se for consulta por Protocolo (resultado único)
            const status = data.resposta ? '<span class="text-success fw-bold">RESPONDIDA</span>' : '<span class="text-danger fw-bold">PENDENTE</span>';
            const respostaDetalhe = data.resposta ? `<p class="mt-3 p-3 border rounded bg-light"><strong>Resposta Oficial:</strong> ${data.resposta}</p>` : '';

            const html = `
                <div class="card p-3 shadow-sm">
                    <h5 class="card-title text-primary">Protocolo: #${data.protocolo}</h5>
                    <p class="card-text mb-1"><strong>Nome:</strong> ${data.nome || 'Anônimo'}</p>
                    <p class="card-text mb-1"><strong>Tipo:</strong> ${data.tipo.toUpperCase()}</p>
                    <p class="card-text mb-1"><strong>Data:</strong> ${data.data}</p>
                    <hr>
                    <p class="card-text mb-1"><strong>Descrição:</strong> ${data.descricao}</p>
                    <p class="card-text mt-2"><strong>Status:</strong> ${status}</p>
                    ${respostaDetalhe}
                </div>
            `;
            container.html(html);
        }
    }


    // ===============================================
    // LÓGICA DE TEMA ESCURO (DARK MODE)
    // ===============================================

    const toggleThemeButton = document.getElementById('toggleTheme');
    const body = document.body;
    const themeKey = 'ouvidoria-dark-theme';

    function aplicarTemaSalvo() {
        const savedTheme = localStorage.getItem(themeKey);
        if (savedTheme === 'enabled') {
            body.classList.add('dark-theme');
            if (toggleThemeButton) {
                toggleThemeButton.textContent = 'Tema Claro';
            }
        } else {
            body.classList.remove('dark-theme');
            if (toggleThemeButton) {
                toggleThemeButton.textContent = 'Tema Escuro';
            }
        }
    }

    function toggleTheme() {
        if (body.classList.contains('dark-theme')) {
            body.classList.remove('dark-theme');
            localStorage.setItem(themeKey, 'disabled');
            if (toggleThemeButton) {
                toggleThemeButton.textContent = 'Tema Escuro';
            }
        } else {
            body.classList.add('dark-theme');
            localStorage.setItem(themeKey, 'enabled');
            if (toggleThemeButton) {
                toggleThemeButton.textContent = 'Tema Claro';
            }
        }
    }

    // Inicialização: Aplica o tema logo que a página carrega
    document.addEventListener('DOMContentLoaded', aplicarTemaSalvo);

    // Evento: Conecta a função ao clique do botão
    if (toggleThemeButton) {
        toggleThemeButton.addEventListener('click', toggleTheme);
    }
    
    
    // ===============================================
    // LÓGICA DE FORMULÁRIOS (MANTIDA DO SEU CÓDIGO ORIGINAL)
    // ===============================================

    // REGISTRO
    $('#formRegistro').on('submit', function(e){
        e.preventDefault();
        $('#cpf').val($('#cpf').val().replace(/[^0-9]/g, ''));
        $('#matricula').val($('#matricula').val().replace(/[^0-9]/g, ''));
        
        $.post('/registrar', $(this).serialize(), function(data){
            $('#resultadoRegistro').html('<div class="alert alert-success">Manifestação registrada com sucesso! Seu protocolo é: <strong>#' + data.protocolo + '</strong>. Guarde bem este número!</div>');
            $('#formRegistro')[0].reset();
        }).fail(function(err){
            $('#resultadoRegistro').html('<div class="alert alert-danger">' + (err.responseJSON?.erro || 'Erro desconhecido ao registrar.') + '</div>');
        });
    });

    // CONSULTA POR PROTOCOLO
    $('#formConsultaProtocolo').on('submit', function(e){
        e.preventDefault();
        $('#protocolo').val($('#protocolo').val().replace(/[^0-9]/g, ''));
        
        $.post('/consultar', $(this).serialize(), function(data){
            formatResults(data, 'resultadoConsulta');
        }).fail(function(err){
            $('#resultadoConsulta').html('<div class="alert alert-danger">' + (err.responseJSON?.erro || 'Manifestação não encontrada.') + '</div>');
        });
    });

    // CONSULTA POR CPF
    $('#formConsultaCPF').on('submit', function(e){
        e.preventDefault();
        $('#cpfBusca').val($('#cpfBusca').val().replace(/[^0-9]/g, ''));
        
        $.post('/consultar_cpf', $(this).serialize(), function(data){
            formatResults(data, 'resultadoConsultaCPF');
        }).fail(function(err){
            $('#resultadoConsultaCPF').html('<div class="alert alert-danger">' + (err.responseJSON?.erro || 'Erro na consulta por CPF.') + '</div>');
        });
    });

    // CONSULTA POR MATRÍCULA
    $('#formConsultaMatricula').on('submit', function(e){
        e.preventDefault();
        $('#matriculaBusca').val($('#matriculaBusca').val().replace(/[^0-9]/g, ''));
        
        $.post('/consultar_matricula', $(this).serialize(), function(data){
            formatResults(data, 'resultadoConsultaMatricula');
        }).fail(function(err){
            $('#resultadoConsultaMatricula').html('<div class="alert alert-danger">' + (err.responseJSON?.erro || 'Erro na consulta por Matrícula.') + '</div>');
        });
    });

    // GARANTIA DE LIMPEZA DE CAMPO (Apenas números)
    document.getElementById('cpf').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('matricula').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    
    document.getElementById('protocolo').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('cpfBusca').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('matriculaBusca').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    
</script>

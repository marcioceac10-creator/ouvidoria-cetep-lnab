<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouvidoria CETEP LNAB</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container mt-5">
    
    <header class="text-center mb-4">
      <div class="logo-box d-flex justify-content-center align-items-center">
        <img src="https://i.im.ge/2025/04/11/pVTi0z.logo.png" alt="logo" height="60" class="me-3">
        <h1>Ouvidoria CETEP LNAB</h1>
      </div>
      <p class="text-muted">A sua voz faz a diferença.</p>
    </header>

    <div class="d-flex justify-content-end mb-3">
        <button id="toggleTheme" class="btn btn-outline-secondary btn-sm">Tema Escuro</button>
    </div>

    <ul class="nav nav-pills nav-fill mb-4" id="mainTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="registro-tab" data-bs-toggle="pill" data-bs-target="#registro" type="button" role="tab" aria-controls="registro" aria-selected="true">
            <i class="fas fa-edit"></i> Registrar Manifestação
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="consulta-main-tab" data-bs-toggle="pill" data-bs-target="#consulta-main" type="button" role="tab" aria-controls="consulta-main" aria-selected="false">
            <i class="fas fa-search"></i> Consultar Manifestação
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" href="{{ url_for('admin_page') }}">
            <i class="fas fa-user-shield"></i> Área Admin
        </a>
      </li>
    </ul>

    <div class="tab-content">
      
      <div class="tab-pane fade show active" id="registro" role="tabpanel" aria-labelledby="registro-tab">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center">Formulário de Registro</h3>
                
                <form id="formRegistro">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome (Opcional, se Anônimo)</label>
                        <input type="text" class="form-control" id="nome" name="nome">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cpf" class="form-label">CPF (Apenas números, obrigatório)</label>
                            <input type="text" class="form-control" id="cpf" name="cpf" maxlength="11" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="matricula" class="form-label">Matrícula (Apenas números, obrigatório)</label>
                            <input type="text" class="form-control" id="matricula" name="matricula" maxlength="8" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="tipo" class="form-label">Tipo de Manifestação</label>
                        <select class="form-select" id="tipo" name="tipo" required>
                            <option value="" disabled selected>Selecione o Tipo</option>
                            <option value="denuncia">Denúncia</option>
                            <option value="elogio">Elogio</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="solicitacao">Solicitação</option>
                            <option value="reclamacao">Reclamação</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição da Manifestação (Mínimo 20 caracteres)</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="5" minlength="20" required></textarea>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Registrar</button>
                    </div>
                </form>

                <div id="resultadoRegistro" class="mt-3 text-center"></div>
            </div>
        </div>
      </div>
      
      <div class="tab-pane fade" id="consulta-main" role="tabpanel" aria-labelledby="consulta-main-tab">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center">Consultar Manifestações</h3>

                <ul class="nav nav-pills nav-fill mb-4" id="consultasPills" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="consulta-protocolo-tab" data-bs-toggle="pill" data-bs-target="#consulta-protocolo" type="button" role="tab">Protocolo</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="consulta-cpf-tab" data-bs-toggle="pill" data-bs-target="#consulta-cpf" type="button" role="tab">CPF</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="consulta-matricula-tab" data-bs-toggle="pill" data-bs-target="#consulta-matricula" type="button" role="tab">Matrícula</button>
                    </li>
                </ul>

                <div class="tab-content">
                    
                    <div class="tab-pane fade show active" id="consulta-protocolo" role="tabpanel">
                        <form id="formConsultaProtocolo">
                            <div class="mb-3">
                                <label for="protocolo" class="form-label">Protocolo da Manifestação</label>
                                <input type="text" class="form-control" id="protocolo" name="protocolo" maxlength="10" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-secondary">Consultar</button>
                            </div>
                        </form>
                        <div id="resultadoConsulta" class="mt-3"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="consulta-cpf" role="tabpanel">
                        <form id="formConsultaCPF">
                            <div class="mb-3">
                                <label for="cpfBusca" class="form-label">CPF do Manifestante</label>
                                <input type="text" class="form-control" id="cpfBusca" name="cpfBusca" maxlength="11" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-info">Consultar</button>
                            </div>
                        </form>
                        <div id="resultadoConsultaCPF" class="mt-3"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="consulta-matricula" role="tabpanel">
                        <form id="formConsultaMatricula">
                            <div class="mb-3">
                                <label for="matriculaBusca" class="form-label">Matrícula do Manifestante</label>
                                <input type="text" class="form-control" id="matriculaBusca" name="matriculaBusca" maxlength="8" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-warning">Consultar</button>
                            </div>
                        </form>
                        <div id="resultadoConsultaMatricula" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
      </div>
      
    </div> </div> <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Seus scripts existentes (APENAS O JAVASCRIPT)
    
    // ===============================================
    // ATENÇÃO: COPIE E COLE AQUI TODO O JAVASCRIPT QUE ESTAVA
    // NO FINAL DO SEU INDEX.HTML ORIGINAL.
    // Garanta que as funções de formatResults, toggleTheme e 
    // os listeners de form (formRegistro, formConsultaProtocolo, etc.)
    // estejam aqui!
    // ===============================================

    // Exemplo de como era o script, APENAS COLOQUE O SEU AQUI:
    // function formatResults(data, containerId) { ... }
    // $('#formRegistro').on('submit', function(e){...});
    // etc...

    
    // GARANTIA DE LIMPEZA DE CAMPO (CPF E MATRÍCULA)
    document.getElementById('cpf').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('matricula').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    
    document.getElementById('protocolo').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('cpfBusca').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    document.getElementById('matriculaBusca').oninput = (e) => e.target.value = e.target.value.replace(/[^0-9]/g, '');
    
  </script>
</body>
</html>
